defaults:
  - _self_
  - task: secvla_dp_delta

name: train_diffusion_transformer_secvla_tokens
_target_: diffusion_policy.workspace.train_diffusion_transformer_hybrid_workspace.TrainDiffusionTransformerHybridWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "secvla_exact_encoder_transformer_tokens"

horizon: 100
n_obs_steps: 1
n_action_steps: 100
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_cond: True
pred_action_steps_only: False

policy:
  _target_: diffusion_policy.policy.diffusion_transformer_vla_token_image_policy.DiffusionTransformerVLAImageTokenPolicy
  shape_meta: ${shape_meta}

  obs_encoder:
    _target_: diffusion_policy.model.vision.secvla_obs_encoder.SecVLAObsEncoderTokens
    shape_meta: ${shape_meta}
    siglip_model_name: google/siglip2-base-patch16-224
    d_model: 768
    num_heads: 8
    # Was 6 (mismatch); SecVLA default is 4.
    num_fusion_layers: 4
    unfreeze_last_n_layers: 0
    siglip_deterministic_embeddings: True
    use_depth: true
    use_memory: true
    depth_use_mask_channel: true
    n_vis_pool: 32
    perceiver_depth: 1
    sector_zmin: 0.0
    sector_zmax: 5.0
    # Keep the encoder wrapping single-frame [B,3,H,W] as a 1-slot memory
    # so the runtime contract matches the unet variant.
    expected_memory_size: 1
    # 4-way action head (matches SecVLA's status_head).
    attach_action_head: true
    num_actions: 4
    action_head_layers: 2
    action_head_dropout: 0.1
    encoder_checkpoint_path: null

  model:
    _target_: diffusion_policy.model.diffusion.transformer_for_diffusion.TransformerForDiffusion
    input_dim: 2
    output_dim: 2
    horizon: ${horizon}
    n_obs_steps: ${n_obs_steps}
    cond_dim: 768
    max_cond_tokens: 256
    cond_causal_mask: False
    n_layer: 8
    n_head: 4
    n_emb: 768
    p_drop_emb: 0.0
    p_drop_attn: 0.1
    causal_attn: True
    time_as_cond: True
    obs_as_cond: True
    n_cond_layers: 0

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: True
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_cond: ${obs_as_cond}
  pred_action_steps_only: ${pred_action_steps_only}
  # CE loss weight on the 4-way action head (STOP / FWD / LEFT / RIGHT).
  # SecVLA uses 0.3; we use 0.1 here since DDPM ε-pred MSE is in a smaller
  # numeric range.
  action_loss_weight: 0.1
  action_label_smoothing: 0.0

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 16
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 16
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  # Align with SecVLA: AdamW lr=1e-4, weight_decay=1e-4, betas=(0.9, 0.999).
  # Workspace splits weight_decay between transformer and encoder; we set
  # both to 1e-4 to match SecVLA's single-group AdamW.
  transformer_weight_decay: 1.0e-4
  obs_encoder_weight_decay: 1.0e-4
  learning_rate: 1.0e-4
  betas: [0.9, 0.999]

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 40000
  num_epochs: 1
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  rollout_every: 50
  checkpoint_every: 10
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: vla_nav_diffusion_policy
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}", "secvla", "transformer"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 3
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.4f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
