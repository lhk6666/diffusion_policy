defaults:
  - _self_
  - task: secvla_dp_delta

name: train_diffusion_unet_secvla_encoder
_target_: diffusion_policy.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "secvla_exact_encoder_unet"

horizon: 100
n_obs_steps: 1
n_action_steps: 100
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.diffusion_unet_image_policy.DiffusionUnetImagePolicy
  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: True
    prediction_type: epsilon

  obs_encoder:
    _target_: diffusion_policy.model.vision.secvla_obs_encoder.SecVLAObsEncoder
    shape_meta: ${shape_meta}
    siglip_model_name: google/siglip2-base-patch16-224
    d_model: 768
    num_heads: 8
    num_fusion_layers: 4
    unfreeze_last_n_layers: 0
    siglip_deterministic_embeddings: True
    use_depth: true
    depth_use_mask_channel: true
    sector_zmin: 0.0
    sector_zmax: 5.0
    # Memory module + 4-way action head — matches SecVLA training.
    # ``expected_memory_size: 1`` keeps the dataset's single-frame samples
    # working: the encoder wraps [B,3,H,W] as a 1-slot memory.
    use_memory: true
    n_vis_pool: 32
    perceiver_depth: 1
    expected_memory_size: 1
    attach_action_head: true
    num_actions: 4
    action_head_layers: 2
    action_head_dropout: 0.1
    encoder_checkpoint_path: null
    pooling: mean

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True
  # CE loss weight on the action head. SecVLA uses 0.3; we ship 0.1 here
  # since the DDPM ε-prediction MSE is in a smaller numeric range.
  action_loss_weight: 0.1
  action_label_smoothing: 0.0

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 16
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 16
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  # Match SecVLA's AdamW exactly (betas come from PyTorch defaults there).
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-4

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 40000
  num_epochs: 1
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  rollout_every: 50
  checkpoint_every: 10
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: vla_nav_diffusion_policy
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}", "secvla", "unet"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 3
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.4f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
